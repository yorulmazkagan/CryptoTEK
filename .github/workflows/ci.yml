name: Q-ADAPTIVE CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main"]

env:
  PYTHON_VERSION: "3.11"

  # Rust surumu SABITLENDI (solhint@5 ve slither-analyzer==0.11.6 ile ayni
  # gerekce). "stable" iken CI, gelistiricinin yerelindekinden daha yeni bir
  # derleyici kullaniyordu ve clippy'nin yeni eklenen lint'leri yerelde
  # gorunmeden CI'i kiriyordu — tam olarak boyle bir kirilma yasandi:
  #
  #   yerel  clippy 0.1.96  -> temiz
  #   CI     clippy 1.98    -> error: redundant reference in `format!` argument
  #
  # Sabit surum, "yerelde gecti" ifadesinin CI icin de anlamli olmasini
  # saglar. Yukseltme bilincli bir karar olmali: burayi artir, yerelde ayni
  # surumu kur (`rustup toolchain install`), clippy'yi kosur, cikan yeni
  # lint'leri duzelt.
  RUST_TOOLCHAIN: "1.96"

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Job 1 — Python ONNX Inference Engine & FastAPI Layer
  # ─────────────────────────────────────────────────────────────────────────────
  python-ai-tests:
    name: "Python · ONNX Inference & API Tests"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Q-Adaptive-AI

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # ──────────────────────────────────────────────────────────────────────
      # HATA E20 ve onun gizlediği ikinci hata
      # ──────────────────────────────────────────────────────────────────────
      # E20: Bu adımın adındaki alıntılanmamış iki nokta — "(target: 12/12 pass)"
      # — YAML'i geçersiz kılıyordu. GitHub dosyayı hiç ayrıştıramıyordu.
      #
      # YAML düzeltilince İKİNCİ bir hata ortaya çıktı: `test_onnx_inference.py`
      # bir pytest paketi DEĞİL. İçinde `test_` ile başlayan hiçbir fonksiyon
      # yok; tek bir `run_onnx_inference_test()` fonksiyonu var ve `__main__`
      # altından çağrılıyor. `pytest` bu dosyadan hiç test toplayamaz ve
      # **çıkış kodu 5 ile düşer**.
      #
      # Yani "CI'da 12/12 test geçiyor" ifadesinin iki ayrı sorunu vardı:
      #   • CI hiç koşmuyordu (geçersiz YAML),
      #   • koşsaydı bu adım düşecekti (pytest hiç test bulamaz).
      # Ayrıca betik 12 test değil ÜÇ senaryo koşuyor.
      #
      # Doğru çağrı: betiği doğrudan çalıştırmak. Başarısızlıkta sıfır olmayan
      # çıkış kodu döndürüyor, yani CI'ı gerçekten kapılıyor.
      - name: "Run ONNX inference parity check (3 senaryo)"
        run: python test_onnx_inference.py

      # Saf Python Keccak-256 / secp256k1 uygulamasının bilinen vektörlerle
      # sınanması. Asıl doğrulama zincirde (GuardianAttestation.t.sol) yapılır;
      # bu, hızlı geri bildirim katmanı.
      - name: "Guardian attestation kripto birim testleri (18 test)"
        run: python test_attestation.py

      # Arayüzün API'de OLMAYAN bir alana baglanmasini engeller.
      #
      # Arayuzdeki her bagli alan `data-bind="pqc_detail.signature_bytes"`
      # biciminde isaretli; bu test o yollari HTML'den okuyup Pydantic yanit
      # modelinde gercekten var olduklarini dogrular. Ayrica eski arayuzun
      # uydurma sayilarinin (3.85, 98.52, 56.4) geri gelmedigini ve CDN
      # bagimliligi eklenmedigini sinar.
      #
      # Bu, denetimin asil dersinin otomatiklestirilmis hali: belge/arayuz,
      # kodda olmayan bir seyi iddia edemesin.
      - name: "API ↔ arayüz sözleşme testi"
        run: python test_api_contract.py

      # `test_api_client.py` de bir betik, pytest paketi değil — ve ÇALIŞAN BİR
      # SUNUCU gerektiriyor. Sunucu ayağa kaldırılmadan çağrılırsa bağlantı
      # hatası verir. Bu yüzden sunucu arka planda başlatılıp hazır olması
      # bekleniyor.
      - name: "Run API integration tests (sunucu ile)"
        run: |
          python run_server.py &
          SERVER_PID=$!
          # Sunucunun hazır olmasını bekle (en fazla 30 sn).
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/api/health >/dev/null 2>&1; then
              echo "Sunucu hazır ($i sn)"
              break
            fi
            sleep 1
          done
          set +e
          python test_api_client.py
          SONUC=$?
          set -e
          kill $SERVER_PID 2>/dev/null || true
          exit $SONUC

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-test-results
          path: Q-Adaptive-AI/**/*.log

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 2 — Rust Winterfell ZK-STARK Prover Core
  # ─────────────────────────────────────────────────────────────────────────────
  rust-zk-check:
    name: "Rust · Winterfell STARK Prover Check & Clippy"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Q-Adaptive-ZK

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain (${{ env.RUST_TOOLCHAIN }})
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "Q-Adaptive-ZK -> target"

      - name: Cargo check (fast compile validation)
        run: cargo check --all-targets

      - name: Clippy lint (deny warnings)
        run: cargo clippy --all-targets -- -D warnings

      - name: Cargo fmt check
        run: cargo fmt --check

      - name: Cargo test (release profile for prover benchmarks)
        run: cargo test --release -- --nocapture

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 3 — EVM Solidity ERC-4337 Smart Contracts
  # ─────────────────────────────────────────────────────────────────────────────
  # ───────────────────────────────────────────────────────────────────────────
  # Solidity testleri — BULGU 8
  # ───────────────────────────────────────────────────────────────────────────
  # Bu iş daha önce YOKTU çünkü depoda tek bir `.t.sol` dosyası yoktu.
  # Gerçek ve sömürülebilir fon kaybı açığı (bulgu 5) tam da bu katmandaydı.
  solidity-tests:
    name: "Solidity · Foundry Tests (BULGU 5, 6, 14 + E1, E3, E4, E7)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Q-Adaptive-Contracts

    steps:
      # forge-std depoda bir git submodule olarak sabitlenmiştir; `recursive`
      # ile çekilir. Böylece CI her koşuda internetten taze bir sürüm çekmek
      # yerine, testlerin gerçekten geçtiği commit'i kullanır.
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Build contracts
        run: forge build

      # Guardian fixture'ını Python ile YENİDEN ÜRET.
      # Depodaki fixture bayatsa bu adım onu tazeler; ardından gelen
      # GuardianAttestation testleri Python'un güncel imzasını gerçek
      # sözleşmeye verir. Python ↔ Solidity digest hizalaması bozulursa
      # test kırılır.
      - name: Regenerate guardian attestation fixture
        working-directory: .
        run: python3 scripts/generate_guardian_fixture.py

      - name: "Fixture depodakiyle aynı mı (bayat fixture kontrolü)"
        working-directory: .
        run: |
          if ! git diff --quiet -- Q-Adaptive-Contracts/test/fixtures/; then
            echo "::error::Depodaki guardian fixture bayat. Çalıştırın: python3 scripts/generate_guardian_fixture.py"
            git diff -- Q-Adaptive-Contracts/test/fixtures/
            exit 1
          fi
          echo "OK: fixture güncel"

      # `ETH_RPC_URL` ortama gecirilir. Deponun Settings > Secrets bolumunde
      # bu sir TANIMLIYSA `EntryPointFork.t.sol` gercek EntryPoint v0.7
      # baytkoduna karsi kosar; TANIMLI DEGILSE degisken bos gelir ve o dort
      # test kendini atlayip [SKIP] raporlar — is yine yesil kalir.
      #
      # Yani sir eklemek zorunlu degil, ama eklenirse kapsama gercek bir
      # katman ekler. Sir olmadan CI'in asla sahte bir [PASS] uretmedigi
      # testin kendi `vm.skip(true)` mantigiyla garanti altinda.
      - name: Run Foundry tests (fuzz dahil)
        run: forge test -vv
        env:
          ETH_RPC_URL: ${{ secrets.ETH_RPC_URL }}

      - name: Measure coverage
        run: forge coverage --report summary

      - name: Gas snapshot
        run: forge test --gas-report

      # Konuşlandırma betiği derlenmeli ve kuru koşuda kendi ön/son
      # kontrollerini geçmeli. `test/Deploy.t.sol` bunu zaten `forge test`
      # içinde yapıyor; bu adım betiğin CLI yolunun da bozulmadığını
      # doğruluyor — betik derlenmezse yarışma gunu fark edilirdi.
      - name: Deploy script derleniyor mu
        run: forge build --skip test

  # ───────────────────────────────────────────────────────────────────────────
  # Regresyon korumaları — düzeltilen hataların sessizce geri gelmesini engeller
  # ───────────────────────────────────────────────────────────────────────────
  regression-guards:
    name: "Regresyon Koruması · Kapatılan bulgular geri gelmesin"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # BULGU 7: kriptografik olmayan hash kripto yoluna dönerse yapı kırılsın.
      - name: "BULGU 7 — DefaultHasher kripto yolunda olmamalı"
        run: |
          if grep -rn --include=*.rs "DefaultHasher" Q-Adaptive-ZK/src/ \
               | grep -vE "^\S+:[0-9]+:\s*(//|///)"; then
            echo "::error::DefaultHasher (SipHash) kripto yoluna geri döndü — bulgu 7"
            exit 1
          fi
          echo "OK: kod satırlarında DefaultHasher yok"

      # BULGU 3: sabit 90.0 eşiği geri dönerse yapı kırılsın.
      - name: "BULGU 3 — sabit 90.0 eşiği olmamalı"
        run: |
          if grep -rnE --include=*.rs --include=*.py "(>|>=)\s*90\.0" \
               Q-Adaptive-ZK/src/ Q-Adaptive-AI/src/ \
               | grep -vE "^\S+:[0-9]+:\s*(//|///|#)"; then
            echo "::error::Sabit 90.0 eşiği geri döndü — bulgu 3"
            exit 1
          fi
          echo "OK: sabit eşik yok"

      # BULGU 13: uydurma 4608 calldata tabanı geri dönerse yapı kırılsın.
      - name: "BULGU 13 — raw_sig_bytes = 4608 tabanı olmamalı"
        run: |
          if grep -rn --include=*.py "raw_sig_bytes" Q-Adaptive-AI/src/ \
               | grep -vE "^\S+:[0-9]+:\s*#"; then
            echo "::error::Uydurma 4608 calldata tabanı geri döndü — bulgu 13"
            exit 1
          fi
          echo "OK: uydurma taban yok"

      # BULGU 11: process::id() determinizmi bozarsa yapı kırılsın.
      # NOT: `-H` şart. grep tek bir dosyada dosya adını basmaz ve o zaman
      # aşağıdaki yorum filtresi tutmaz — koruma sahte hata verir.
      - name: "BULGU 11 — process::id() ρ' türetimine karışmamalı"
        run: |
          if grep -rnH --include=*.rs "process::id" Q-Adaptive-ZK/src/hashing.rs \
               | grep -vE "^[^:]+:[0-9]+:\s*(//|///)"; then
            echo "::error::process::id() ρ' türetimine geri döndü — bulgu 11"
            exit 1
          fi
          echo "OK: ρ' türetimi deterministik"

      # HATA E1: 2300 gaz stipend'i geri dönerse yapı kırılsın.
      - name: "HATA E1 — ön-fonlamada gas: 2300 stipend'i olmamalı"
        run: |
          if grep -rn --include=*.sol "call{gas: 2300" Q-Adaptive-Contracts/contracts/ \
               | grep -vE "^\S+:[0-9]+:\s*(\*|//)"; then
            echo "::error::gas: 2300 stipend'i geri döndü — hata E1"
            exit 1
          fi
          echo "OK: stipend yok"

      # Bu denetimin asıl dersi: belge, kodda olmayan bir şeyi iddia edemesin.
      # `docs/` altındaki "Kod İncelemesi" bölümleri kaynak dosyaların tamamını
      # alıntılıyordu ve alıntı donmuştu — `DefaultHasher` koddan silindikten
      # sonra belgede 21 yerde durmaya devam etti. Bloklar artık elle
      # yazılmıyor, kaynaktan üretiliyor; bu adım kaymayı yakalar.
      - name: "Belge kod blokları kaynakla eşleşmeli"
        run: python3 docs/kod_bloklari_senkron.py --check

  solidity-lint:
    name: "Solidity · ERC-4337 Contract Lint & Slither Analysis"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Q-Adaptive-Contracts

    steps:
      # forge-std submodule'u Slither icin sart: crytic-compile sozlesmeleri
      # `forge build` ile derliyor ve test/ altindaki dosyalar forge-std'ye
      # bagimli.
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # Foundry KURULMASI GEREKIYOR — yoksa Slither hic calismaz.
      #
      # Bu is eskiden Foundry kurmuyordu ve sorun da cikmiyordu, cunku
      # `foundry.toml` yoktu: crytic-compile projeyi duz bir solc projesi
      # sayiyordu. `foundry.toml` eklendikten sonra projeyi Foundry projesi
      # olarak algilayip `forge config --json` calistirmaya calisiyor ve
      # su hatayla aninda duşuyor:
      #
      #   Cannot execute `forge`, is it installed and in PATH?
      #   FileNotFoundError: No such file or directory: 'forge'
      #
      # Yani Slither bu depoda sozlesmeleri BIR KEZ BILE analiz etmemisti:
      # once solhint yapilandirma hatasiyla duşuyordu (adim hic calismiyordu),
      # sonra da forge bulunamadigi icin aninda cokuyordu. `continue-on-error`
      # bunu gizliyordu.
      - name: Install Foundry (Slither'in derleyicisi)
        uses: foundry-rs/foundry-toolchain@v1

      - name: Set up Node.js (for solhint)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install solhint
        # Surum sabitlendi: solhint ana surumleri arasinda varsayilan kural
        # kumesi degisiyor (or. gas-custom-errors 4.x ile geldi). Sabit surum
        # olmadan CI bir gun kendiliginden kirilir.
        run: npm install -g solhint@5

      # `.solhint.json` daha once YOKTU; solhint yapilandirma bulamayinca
      # cikis kodu 255 ile duser ("Failed to load a solhint's config file")
      # ve bu is ilk gunden beri kirmiziydi. Kurallarin gerekceleri
      # Q-Adaptive-Contracts/SOLHINT_KURALLARI.md dosyasinda.
      - name: Run solhint on contracts
        run: solhint 'contracts/**/*.sol'

      - name: Set up Python (for Slither)
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Slither
        # Surum sabitlendi (solhint@5 ile ayni gerekce): Slither ana surumleri
        # yeni dedektorler ekliyor. Sabitlenmezse bugun yesil olan CI, bizim
        # hicbir sey degistirmedigimiz bir gun kendiliginden kirilir.
        # Yukseltme bilincli bir karar olmali: surumu burada artir, bulgulari
        # triyaj et, SLITHER_TRIYAJI.md'yi guncelle.
        run: pip install slither-analyzer==0.11.6

      # ZAFIYET TARAMASI — asil is bu adim.
      #
      # Onceki komut `slither . --print human-summary` idi. `--print` bayragi
      # Slither'a bir PRINTER calistirmasini soyler ve printer modunda zafiyet
      # DEDEKTORLERI kosmaz; yalnizca bir ozet tablosu basilir. Yani o komut
      # "statik analiz" gibi gorunup aslinda hicbir zafiyet aramiyordu.
      #
      # Bu belirsizligi tahminle kapatmak yerine komut ikiye ayrildi:
      # asagidaki adim dedektorleri calistirir, sonraki adim ozet basar.
      # Boylece dedektorlerin kostugu komutun kendisinden okunabiliyor.
      #
      # `continue-on-error` SIMDILIK duruyor cunku bulgular henuz triyaj
      # edilmedi. Siradaki adim: ciktiyi okumak, gercek bulgulari duzeltmek,
      # gerekceli olanlari slither.config.json ile dislamak ve ardindan bu
      # satiri KALDIRMAK. O noktaya kadar bu is "Slither'dan geciyoruz" demek
      # icin bir dayanak DEGILDIR.
      # Cikti hem loga hem dosyaya yazilir. Dosya artefakt olarak yuklenir;
      # boylece raporu okumak icin GitHub'in log goruntuleyicisinde kaydirmak
      # gerekmez — tek tiklamayla indirilir.
      # ARTIK GERCEK BIR KAPI — `continue-on-error` KALDIRILDI.
      #
      # Kosu #10'da bulgular ilk kez okundu ve triyaj edildi
      # (SLITHER_TRIYAJI.md). Uc gercek sorun duzeltildi, gerekceli olanlar
      # slither.config.json ile disllandi. Kosu #11'de geriye bulgu kalmadi.
      #
      # Bu satirin kaldirilmasi, "Slither'dan geciyoruz" ifadesinin ilk kez
      # dayanagi oldugu an. Yeni bir bulgu cikarsa CI GERCEKTEN kirilir.
      #
      # NOT: `tee` kullanildigi icin cikis kodu boru hattinin SON komutundan
      # gelir. `pipefail` olmadan `slither` duşse bile `tee` 0 dondurur ve
      # kapi yine sessizce acilir — bu yuzden `set -o pipefail` sart.
      - name: Slither vulnerability detectors
        run: |
          set -o pipefail
          slither . 2>&1 | tee slither-report.txt

      # Bilgilendirme: sozlesme sayisi, satir sayisi, karmasiklik ozeti.
      # Zafiyet aramaz; yukaridaki adimin isini yapmaz. Ozet basmak
      # basarisiz olsa bile bu CI'i kirmamali, o yuzden burada
      # `continue-on-error` KALIYOR.
      - name: Slither human-readable summary
        run: slither . --print human-summary 2>&1 | tee -a slither-report.txt
        continue-on-error: true

      - name: Upload Slither report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: slither-report
          path: Q-Adaptive-Contracts/slither-report.txt

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 4 — Repository hygiene & documentation gate
  # ─────────────────────────────────────────────────────────────────────────────
  hygiene:
    name: "Repo · Hygiene Check"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify README exists and is non-empty
        run: test -s README.md && echo "README.md ✓"

      # Bu adim HICBIR SEY TARAMIYORDU.
      #
      # `base` varsayilan dal (main), `head` ise HEAD idi. main'e yapilan bir
      # push'ta ikisi ayni commit'e isaret eder ve TruffleHog'un kendisi bunu
      # soyluyordu:
      #
      #   "BASE and HEAD commits are the same. TruffleHog won't scan anything."
      #
      # Ustelik `continue-on-error: true` yuzunden bu hata isi kirmizi
      # yapmiyordu: is YESIL gorunuyor ama hicbir koruma saglamiyordu. Bu,
      # denetimin yakaladigi hatalarin aynisi — "kostugu iddia edilen ama
      # aslinda hicbir sey yapmayan kontrol".
      #
      # Duzeltme: base/head araligi kaldirildi, tum dosya sistemi taraniyor.
      # `continue-on-error` da kaldirildi; `--only-verified` sayesinde bulgu
      # ancak saglayiciya karsi DOGRULANMIS canli bir kimlik bilgisi olursa
      # cikar, yani yanlis pozitif riski cok dusuk. Boyle bir bulgu CI'i
      # kirmali.
      #
      # `extra_args` icinde `--fail` VERILMEZ: action bu bayragi kendisi
      # ekliyor ve tekrarlanirsa trufflehog su hatayla duser:
      #   "trufflehog: error: flag 'fail' cannot be repeated"
      # Bulgu durumunda isin kirmizi olmasi yine de saglaniyor - bayragi
      # action geciyor, biz degil.
      - name: Check for accidental secrets (trufflehog)
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          extra_args: --only-verified
